<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Макс — Математический Minecraft</title><style>body{margin:0;background:#14291f;color:#f5ffe9;font:18px system-ui}main{max-width:720px;margin:auto;padding:20px}.card{background:#254632;border:3px solid #69a66c;padding:22px;margin:18px 0;box-shadow:5px 5px #08190e}h1{color:#b7f18a}button{padding:14px;margin:5px;background:#94dc71;border:0;border-bottom:4px solid #45793b;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.choice{display:block;width:100%;text-align:left;background:#3a6447;color:white;border:2px solid #9bbd9d}.cert{background:#fff0bd;color:#25301e;text-align:center;padding:30px;border:8px double #aa8b35}.muted{color:#c2d5c3}#wallet{float:right;background:#e7c65d;color:#25301e;padding:8px}@media print{header,footer,button{display:none}body{background:white}}</style><main><header><b>⛏️ MAXCRAFT MATH</b><span id="wallet"></span></header><div id="app"></div><footer class="muted">Учебная игра в блочном стиле. Монеты виртуальные, не Minecoins. Прогресс хранится на устройстве.</footer></main><script>
const data=[["💎 Алмазная шахта",[[ "7 сундуков по 8 алмазов. Крипер уничтожил 13. Сколько осталось?",[43,45,56],0,"7 × 8 − 13"],["64 факела разложили поровну в 8 сундуков. Сколько в каждом?",[7,8,9],1,"64 ÷ 8"],["Для кирки нужно 3 слитка. Сколько нужно для 12 кирок?",[36,24,48],0,"3 × 12"],["Добыли 125 блоков и ещё 87, потратили 49. Сколько осталось?",[173,163,261],1,"125 + 87 − 49"],["В 9 рядах по 16 алмазов. Сколько всего?",[134,144,154],1,"16 × 9"]]],["🏡 Деревня жителей",[["5 изумрудов стоят по 18 монет. Сколько всего?",[80,90,100],1,"18 × 5"],["6 грядок по 14 морковок, собрали 29. Сколько осталось?",[55,65,84],0,"6 × 14 − 29"],["96 блоков дороги строят поровну за 4 дня. Сколько в день?",[22,24,26],1,"96 ÷ 4"],["Огород 9 на 7 блоков. Какова площадь?",[16,32,63],2,"9 × 7"],["Было 250 монет, купили 3 предмета по 45. Сколько осталось?",[115,125,135],0,"250 − 3 × 45"]]],["💥 Пещера криперов",[["4 крипера имеют по 20 здоровья. Удар наносит 8. Сколько ударов на всех?",[10,12,8],1,"Каждому нужно 3 удара"],["8 рядов стены по 13 блоков. Сколько блоков?",[104,94,114],0,"8 × 13"],["Было 180 стрел, использовали 3 раза по 27. Сколько осталось?",[99,109,81],0,"180 − 3 × 27"],["Периметр квадрата со стороной 12 блоков?",[24,48,144],1,"12 × 4"],["6 сундуков по 32 блока, 75 использовали. Сколько осталось?",[117,127,192],0,"6 × 32 − 75"]]],["🔥 Крепость Незера",[["15 рядов моста по 12 блоков. Сколько всего?",[170,180,190],1,"15 × 12"],["360 блоков на 4 одинаковые башни. Сколько на одну?",[80,90,100],1,"360 ÷ 4"],["Прошли 3/4 пути в 200 блоков. Сколько прошли?",[100,150,175],1,"200 ÷ 4 × 3"],["Температура выросла с −5 до +7. На сколько градусов?",[2,12,-12],1,"5 + 7"],["Потратили 35% от 500 слитков. Сколько?",[175,150,200],0,"30% + 5%"]]],["🐉 Эндер-дракон",[["Нужно 12 глаз Эндера, есть 7 и ещё 3. Сколько не хватает?",[2,3,4],0,"12 − 7 − 3"],["У дракона 240 здоровья, стрела наносит 15. Сколько стрел?",[14,16,18],1,"240 ÷ 15"],["Платформа 11 на 11 блоков. Какова площадь?",[111,121,131],1,"11 × 11"],["4 стопки по 64 блока, потратили 99. Сколько осталось?",[157,167,256],0,"4 × 64 − 99"],["Три ключа по 125 монет. Было 500. Сколько осталось?",[125,175,375],0,"500 − 3 × 125"]]]];
let done=[];try{done=JSON.parse(localStorage.getItem("maxcraft_done")||"[]")}catch{}if(!Array.isArray(done))done=[];let level=0,step=0,wrong=0;const app=document.getElementById("app");function save(){localStorage.setItem("maxcraft_done",JSON.stringify(done));document.getElementById("wallet").textContent="🪙 "+done.length*250}function home(){save();app.innerHTML='<div class="card"><h1>⛏️ Макс, добро пожаловать!</h1><p>5 уровней, 25 задач по математике для 4 класса. За каждый впервые пройденный уровень — сертификат на 250 виртуальных монет!</p></div>'+data.map((d,i)=>'<div class="card"><h2>Уровень '+(i+1)+': '+d[0]+'</h2><p>'+(done.includes(i)?"🏆 Пройден":i>0&&!done.includes(i-1)?"🔒 Пока закрыт":"🎁 250 монет")+'</p><button '+(i>0&&!done.includes(i-1)?"disabled":"")+' onclick="start('+i+')">'+(done.includes(i)?"Повторить":"Играть")+'</button>'+(done.includes(i)?'<button onclick="cert('+i+')">🎫 Сертификат</button>':"")+'</div>').join("")}function start(i){level=i;step=0;show()}function show(){wrong=0;const q=data[level][1][step];app.innerHTML='<div class="card"><p>'+data[level][0]+' · Задание '+(step+1)+' из 5</p><h2>'+q[0]+'</h2>'+q[1].map((v,i)=>'<button class="choice" id="a'+i+'" onclick="answer('+i+')">'+["А","Б","В"][i]+'. '+v+'</button>').join("")+'<div id="feedback"></div><button onclick="hint()">💡 Подсказка</button><button onclick="home()">🏠 Уровни</button></div>'}function hint(){document.getElementById("feedback").textContent="💡 Подумай: "+data[level][1][step][3]}function answer(i){const q=data[level][1][step];if(i!==q[2]){wrong++;document.getElementById("a"+i).disabled=true;document.getElementById("feedback").textContent="Попробуй ещё! 💡 "+q[3];return}document.querySelectorAll(".choice").forEach(b=>b.disabled=true);document.getElementById("feedback").innerHTML='<h2>💎 Верно, Макс!</h2><button onclick="next()">'+(step===4?"🏆 Завершить уровень":"➡️ Дальше")+'</button>'}function next(){if(step<4){step++;show()}else{const first=!done.includes(level);if(first){done.push(level);save()}app.innerHTML='<div class="card"><h1>🏆 Уровень пройден!</h1><p>Все пять заданий решены!</p><h2>'+(first?"🪙 +250 виртуальных монет!":"Награда уже получена.")+'</h2><button onclick="cert('+level+')">🎫 Сертификат</button><button onclick="home()">К уровням</button></div>'}}function cert(i){if(!done.includes(i))return home();app.innerHTML='<div class="cert"><h1>🏆 СЕРТИФИКАТ ГЕРОЯ</h1><h2>МАКС</h2><p>Успешно прошёл уровень</p><h2>'+data[i][0]+'</h2><h1>🪙 250 МОНЕТ</h1><p>Виртуальная награда · Уровень '+(i+1)+'</p></div><button onclick="window.print()">🖨️ Распечатать</button><button onclick="home()">🏠 Уровни</button>'}home();
</script></html>
